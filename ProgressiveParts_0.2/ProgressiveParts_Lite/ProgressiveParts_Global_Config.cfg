// 1. Двигатели (жидкостные)
@PART[*]:HAS[@MODULE[ModuleEngines*]]:FINAL
{
    %thermalMassModifier = 5.0
	%maxTemp = 2000
}

// 2. Ускорители (твердотопливные, SRB)
@PART[*]:HAS[@MODULE[ModuleEngines*],@RESOURCE[SolidFuel]]:FINAL
{
    %thermalMassModifier = 5.0 
	%maxTemp = 1500
}

// 3. Топливные баки (LFO)
@PART[*]:HAS[@RESOURCE[LiquidFuel],@RESOURCE[Oxidizer]]:FINAL
{
    %thermalMassModifier = 5.0 
	%maxTemp = 1000
}
@PART[*]:HAS[@RESOURCE[MonoPropellant]]:FINAL
{
    %thermalMassModifier = 5.0 
	%maxTemp = 1000
}

