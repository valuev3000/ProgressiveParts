// Tier 1 for battery-125 (category: battery) -> electrics
+PART[battery-125]:NEEDS[Kerbalism]
{
    @name = battery-125_L1
    @title = battery-125 L1
    
    @mass *= 1.0


    @RESOURCE[ElectricCharge]
    {
        @amount *= 1.0
        @maxAmount *= 1.0
    }

    %maxPressure = 4000
    %maxTemp = 400

    @TechRequired = electrics
}
